name: Android APK release CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: apk-release
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Install native proof build tools
        run: brew install cmake ninja autoconf automake libtool pkg-config

      - name: Install Android SDK native build tools
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;27.0.12077973"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Install pinned Quantum Rust toolchain and platform targets
        shell: bash
        run: |
          Quantum_RUST_CHANNEL=$(sed -n 's/^channel = "\(.*\)"/\1/p' lib/security/src/main/rust/fee-state-bundle/rust-toolchain.toml)
          test -n "$Quantum_RUST_CHANNEL"
          rustup toolchain install "$Quantum_RUST_CHANNEL" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$Quantum_RUST_CHANNEL" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Decode signing certificate into a file
        env:
          CERTIFICATE_BASE64: ${{ secrets.ANDROID_DIST_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$CERTIFICATE_BASE64"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > google-release.keystore

      - name: Build signed release artifacts
        run: |
          ./gradlew :apps:wallet:instance:main:assembleSiteRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PisApk=true
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/google-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.TOS_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOS_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TOS_UPLOAD_KEY_PASSWORD }}

      - name: Remove temporary signing certificate
        if: always()
        run: rm -f google-release.keystore

      - name: Verify signed APK and native ABI families
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import zipfile

          apk = pathlib.Path("apps/wallet/instance/main/build/outputs/apk/site/release/main-site-release.apk")
          tools = max(
              (p for p in (pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools").iterdir()
               if (p / "apksigner").is_file() and (p / "aapt").is_file()),
              key=lambda p: tuple(map(int, re.findall(r"\d+", p.name))),
          )
          subprocess.run([str(tools / "apksigner"), "verify", "--verbose", str(apk)], check=True)
          badging = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], text=True)
          assert "name='network.tos.wallet'" in badging.splitlines()[0]
          assert "application-debuggable" not in badging
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for abi in ("arm64-v8a", "armeabi-v7a", "x86", "x86_64"):
                  for library in ("libtos_mobile_pq.so", "libtosproofverify.so", "libtoswalletreceipt.so"):
                      assert f"lib/{abi}/{library}" in names, (abi, library)
          print(badging.splitlines()[0])
          PY

      - name: Upload android apk to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TOS-Wallet-${{ github.ref_name }}-apk
          path: apps/wallet/instance/main/build/outputs/apk/site/release/main-site-release.apk

      - name: Fix filename
        run: |
          mkdir -p release
          cp apps/wallet/instance/main/build/outputs/apk/site/release/main-site-release.apk release/TOS-Wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/TOS-Wallet.apk

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: TOS-Wallet.apk
          generate_release_notes: true
