name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autonomous-acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native proof build tools
        # The embedded proof verifier builds secp256k1 through autogen.sh,
        # which needs autotools that the hosted macOS image does not provide.
        run: brew install cmake ninja autoconf automake libtool pkg-config
      - name: Install pinned Quantum Rust toolchain and platform targets
        shell: bash
        run: |
          Quantum_RUST_CHANNEL=$(sed -n 's/^channel = "\(.*\)"/\1/p' lib/security/src/main/rust/fee-state-bundle/rust-toolchain.toml)
          test -n "$Quantum_RUST_CHANNEL"
          rustup toolchain install "$Quantum_RUST_CHANNEL" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$Quantum_RUST_CHANNEL" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Run hermetic static, unit, and build acceptance gates
        run: make test_ci

      - name: Verify Quantum self-pay native signing domains
        run: python3 scripts/test_quantum_self_pay_native.py --output build/quantum-self-pay-native

      - name: Retain Quantum self-pay native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quantum-self-pay-${{ github.sha }}
          path: build/quantum-self-pay-native/report.json
          if-no-files-found: warn


  quantum-proof-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_tosProofAbis: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install native proof build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build autoconf automake libtool pkg-config
      - name: Install pinned Quantum Rust toolchain and platform targets
        shell: bash
        run: |
          Quantum_RUST_CHANNEL=$(sed -n 's/^channel = "\(.*\)"/\1/p' lib/security/src/main/rust/fee-state-bundle/rust-toolchain.toml)
          test -n "$Quantum_RUST_CHANNEL"
          rustup toolchain install "$Quantum_RUST_CHANNEL" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$Quantum_RUST_CHANNEL" aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native proof and transaction JNI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ndk: 27.0.12077973
          cmake: 3.22.1
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            make test_quantum_proof_device
            make test_quantum_history_transport_device
            make test_quantum_expiry_device
      - name: Retain native device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantum-proof-device-${{ github.sha }}
          path: |
            build/quantum-proof-device/instrumentation.log
            build/quantum-expiry-device/instrumentation.log
            apps/wallet/data/account/build/outputs/androidTest-results/connected/
            apps/wallet/data/account/build/reports/androidTests/connected/
          if-no-files-found: warn
